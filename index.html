<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Position Log</title>
<style>
  :root{
    --bg:#12151a;
    --card:#1a1e26;
    --card-2:#20252f;
    --border:#2c313d;
    --text:#e7e9ee;
    --muted:#8b91a1;
    --accent:#5b8def;
    --green:#3ddc97;
    --red:#ff6b6b;
    --amber:#f0a83c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:14px;
    line-height:1.5;
    padding:20px;
  }
  .wrap{max-width:920px;margin:0 auto;}
  h1{font-size:19px;font-weight:600;margin:0 0 2px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;}

  .positions-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .top-tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .top-tab{
    padding:8px 4px;margin-bottom:-1px;border:none;background:none;color:var(--muted);
    font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
  }
  .top-tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .pos-chip{
    padding:7px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--card);cursor:pointer;font-size:13px;color:var(--muted);
  }
  .pos-chip.active{border-color:var(--accent);color:var(--text);background:var(--card-2);}
  .pos-chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;}
  .btn-new{
    padding:7px 12px;border-radius:8px;border:1px dashed var(--border);
    background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  }

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;margin-bottom:16px;
  }
  .card h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--muted);}

  .banner{
    border-radius:10px;padding:16px 18px;margin-bottom:16px;
    border:1px solid var(--border);
  }
  .banner .verdict{font-size:16px;font-weight:600;margin-bottom:4px;}
  .banner .detail{color:var(--muted);font-size:13px;}
  .banner.hold{border-color:#33465f;background:#16202c;}
  .banner.hold .verdict{color:var(--accent);}
  .banner.close-win{border-color:#245c48;background:#122a22;}
  .banner.close-win .verdict{color:var(--green);}
  .banner.close-loss{border-color:#5c2b2b;background:#2a1414;}
  .banner.close-loss .verdict{color:var(--red);}
  .banner.caution{border-color:#5c4c22;background:#2a2312;}
  .banner.caution .verdict{color:var(--amber);}

  .adj-line{
    margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);
    display:flex;gap:8px;align-items:flex-start;
  }
  .adj-tag{
    flex-shrink:0;font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;
    white-space:nowrap;
  }
  .adj-tag.raise{background:#122a22;color:var(--green);}
  .adj-tag.tighten{background:#2a1414;color:var(--red);}
  .adj-tag.none{background:#1c2028;color:var(--muted);}
  .adj-tag.info{background:#16202c;color:var(--accent);}
  .adj-text{color:var(--muted);font-size:13px;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:680px){.grid2{grid-template-columns:1fr;}}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .field{margin-bottom:10px;}
  input,select{
    width:100%;background:var(--card-2);border:1px solid var(--border);
    color:var(--text);border-radius:7px;padding:8px 10px;font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

  button.primary{
    background:var(--accent);color:#0d1117;border:none;border-radius:7px;
    padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;
  }
  button.primary:hover{opacity:0.9;}
  button.ghost{
    background:transparent;color:var(--muted);border:1px solid var(--border);
    border-radius:7px;padding:9px 14px;font-size:13px;cursor:pointer;
  }
  button.danger{color:var(--red);border-color:#5c2b2b;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  td{padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
    font-variant-numeric:tabular-nums;}
  tr:last-child td{border-bottom:none;}
  .tbl-wrap{overflow-x:auto;}
  .pnl-pos{color:var(--green);}
  .pnl-neg{color:var(--red);}
  .tag{
    font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600;
  }
  .tag.hold{background:#16202c;color:var(--accent);}
  .tag.win{background:#122a22;color:var(--green);}
  .tag.loss{background:#2a1414;color:var(--red);}
  .tag.caution{background:#2a2312;color:var(--amber);}
  .tag.trail{background:#122a22;color:var(--green);}
  .tag.itm{background:#122a22;color:var(--green);}
  .tag.otm{background:#1c2028;color:var(--muted);}
  .adj-tag.trail{background:#122a22;color:var(--green);}
  .empty{color:var(--muted);text-align:center;padding:24px 0;font-size:13px;}

  canvas{width:100%;height:140px;display:block;}
  .chart-wrap{position:relative;}
  .chart-tooltip{
    position:absolute;pointer-events:none;display:none;z-index:5;
    background:#0d1117;border:1px solid var(--border);border-radius:6px;
    padding:6px 9px;font-size:11.5px;line-height:1.45;color:var(--text);
    white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,0.45);
  }
  .chart-tooltip .tt-title{font-weight:600;margin-bottom:2px;}
  .chart-tooltip .tt-muted{color:var(--muted);}

  .foot-actions{display:flex;gap:8px;margin-top:4px;}
  .del-x{cursor:pointer;color:var(--muted);}
  .del-x:hover{color:var(--red);}
  .status-closed{color:var(--muted);font-size:12px;margin-bottom:10px;}
  .loading{color:var(--muted);font-size:13px;padding:20px;text-align:center;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading...</div>
</div>

<script>
// Real browser localStorage — works when this file is hosted anywhere (e.g. GitHub Pages),
// unlike window.storage which only exists inside Claude.ai's in-chat artifact preview.
// Wrapped with the same get/set/delete(key, shared) shape so the rest of the app is unchanged.
const LS_PREFIX = 'options-tracker:';
const S = {
  get(key){
    try{
      const v = localStorage.getItem(LS_PREFIX + key);
      return Promise.resolve(v === null ? null : {key, value: v});
    }catch(e){ return Promise.reject(e); }
  },
  set(key, value){
    try{
      localStorage.setItem(LS_PREFIX + key, value);
      return Promise.resolve({key, value});
    }catch(e){ return Promise.reject(e); }
  },
  delete(key){
    try{
      localStorage.removeItem(LS_PREFIX + key);
      return Promise.resolve({key, deleted:true});
    }catch(e){ return Promise.reject(e); }
  }
};
const TIME_SLOTS = ['10:30 AM', '12:00 PM', '3:30 PM'];
function timeOrder(t){ const i = TIME_SLOTS.indexOf(t); return i===-1 ? 99 : i; }
function sortEntries(list){
  return list.slice().sort((a,b)=>{
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return timeOrder(a.time) - timeOrder(b.time);
  });
}
let state = {
  positions: {},      // id -> {ticker, side, strike, expiration, entryDate, entryPremium, contracts, tpPct, slPct, status, closedEntry}
  activeId: null,
  entries: {},         // positionId -> [ {date, stockPrice, bid, ask, iv, delta, notes} ]
  historical: {},       // positionId -> [ {date, close} ]  (pasted-in daily closes for the underlying)
  view: 'positions',    // 'positions' | 'account'
  accountLog: [],        // [ {date, value, notes} ] — total account size over time
  tradeHistory: [],       // [ {positionId, ticker, entryDate, exitDate, entryPremium, exitPremium, contracts, realizedPL, realizedPct} ]
  accountGoals: [],        // custom milestone amounts, e.g. [500, 1000, 2500] — only used once goalsCustomized is true
  goalsCustomized: false,   // whether the user has ever added/removed a milestone (else DEFAULT_ACCOUNT_GOALS is shown)
  _closingId: null        // transient — position currently showing the close form
};

function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n, d=2){ return (n===null||n===undefined||isNaN(n)) ? '—' : Number(n).toFixed(d); }
function priceFromPct(entryPremium, pct){
  const p = entryPremium * (1 + pct/100);
  return Math.max(p, 0); // an option's price can't go negative
}
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

async function loadState(){
  try{
    const posRes = await S.get('positions', false);
    if(posRes && posRes.value) state.positions = JSON.parse(posRes.value);
  }catch(e){ /* no positions yet */ }
  try{
    const activeRes = await S.get('activeId', false);
    if(activeRes && activeRes.value) state.activeId = activeRes.value;
  }catch(e){}
  try{
    const viewRes = await S.get('view', false);
    if(viewRes && viewRes.value) state.view = viewRes.value;
  }catch(e){}
  try{
    const acctRes = await S.get('accountLog', false);
    state.accountLog = acctRes && acctRes.value ? JSON.parse(acctRes.value) : [];
  }catch(e){ state.accountLog = []; }
  try{
    const thRes = await S.get('tradeHistory', false);
    state.tradeHistory = thRes && thRes.value ? JSON.parse(thRes.value) : [];
  }catch(e){ state.tradeHistory = []; }
  try{
    const goalsRes = await S.get('accountGoals', false);
    if(goalsRes && goalsRes.value){
      state.accountGoals = JSON.parse(goalsRes.value);
      state.goalsCustomized = true;
    }
  }catch(e){}
  const ids = Object.keys(state.positions);
  if(!state.activeId || !state.positions[state.activeId]) state.activeId = ids[0] || null;
  for(const id of ids){
    try{
      const eRes = await S.get('entries:' + id, false);
      state.entries[id] = eRes && eRes.value ? JSON.parse(eRes.value) : [];
    }catch(e){ state.entries[id] = []; }
    try{
      const hRes = await S.get('historical:' + id, false);
      state.historical[id] = hRes && hRes.value ? JSON.parse(hRes.value) : [];
    }catch(e){ state.historical[id] = []; }
  }
  render();
}

async function saveView(){
  try{ await S.set('view', state.view, false); }
  catch(e){ console.error('save view failed', e); }
}
async function saveAccountLog(){
  try{ await S.set('accountLog', JSON.stringify(state.accountLog), false); }
  catch(e){ console.error('save account log failed', e); }
}
async function saveTradeHistory(){
  try{ await S.set('tradeHistory', JSON.stringify(state.tradeHistory), false); }
  catch(e){ console.error('save trade history failed', e); }
}
async function saveAccountGoals(){
  try{ await S.set('accountGoals', JSON.stringify(state.accountGoals), false); }
  catch(e){ console.error('save account goals failed', e); }
}
function setView(v){ state.view = v; state._closingId = null; saveView(); render(); }

async function savePositions(){
  try{ await S.set('positions', JSON.stringify(state.positions), false); }
  catch(e){ console.error('save positions failed', e); }
}
async function saveActiveId(){
  try{ await S.set('activeId', state.activeId || '', false); }
  catch(e){ console.error('save active failed', e); }
}
async function saveEntries(id){
  try{ await S.set('entries:' + id, JSON.stringify(state.entries[id] || []), false); }
  catch(e){ console.error('save entries failed', e); }
}
async function saveHistorical(id){
  try{ await S.set('historical:' + id, JSON.stringify(state.historical[id] || []), false); }
  catch(e){ console.error('save historical failed', e); }
}

function selectPosition(id){
  state.activeId = id;
  state._closingId = null; // don't carry a stale close-form to a different position
  saveActiveId();
  render();
}

function computeMark(bid, ask){
  if(bid==null && ask==null) return null;
  if(bid==null) return ask;
  if(ask==null) return bid;
  return (Number(bid) + Number(ask)) / 2;
}

// Pure P&L% calc, split out from evaluate() so peak-tracking can compute it
// without pulling in verdict/trailing-stop logic.
function computePnlPct(pos, entry){
  const mark = computeMark(entry.bid, entry.ask);
  const entryPrem = pos.entryPremium;
  return (mark!=null && entryPrem) ? ((mark - entryPrem) / entryPrem) * 100 : null;
}

// ITM/OTM/ATM relative to the position's strike and side. Null if no stock price logged.
function computeMoneyness(pos, entry){
  if(entry.stockPrice == null || pos.strike == null) return null;
  const diff = pos.side === 'Call' ? (entry.stockPrice - pos.strike) : (pos.strike - entry.stockPrice);
  const state = diff > 0 ? 'ITM' : diff < 0 ? 'OTM' : 'ATM';
  return {state, diff: Math.abs(diff)};
}

// Running high-water-mark of P&L% across a sorted entries array — index i holds the
// best P&L% seen at any checkpoint from 0..i inclusive. Feeds the trailing-stop check
// in evaluate() and the "armed / not armed" status line in the banner.
function computePeakSeries(pos, sortedEntries){
  let peak = null;
  return sortedEntries.map(e=>{
    const p = computePnlPct(pos, e);
    if(p!=null && (peak==null || p>peak)) peak = p;
    return peak;
  });
}

function evaluate(pos, entry, peakPnlPct, sigmaPctForTheta){
  const mark = computeMark(entry.bid, entry.ask);
  const entryPrem = pos.entryPremium;
  const pnlPct = computePnlPct(pos, entry);
  const dte = daysBetween(entry.date, pos.expiration);
  const moneyness = computeMoneyness(pos, entry);
  const thetaInfo = computeThetaInfo(pos, entry, dte, mark, sigmaPctForTheta);
  let verdict, cls, tagCls, detail;

  const tpPrice = priceFromPct(entryPrem, pos.tpPct);
  const slPrice = priceFromPct(entryPrem, pos.slPct);

  // Trailing stop: once P&L% has peaked at or above trailArmPct, it "arms". From then on,
  // giving back trailGivebackPct of that peak (as a fraction of the gain, not raw points)
  // is treated as its own close trigger — independent of the original TP/SL — so a trade
  // that ran up and is fading gets flagged before it round-trips back to breakeven or a loss.
  const trailArmPct = pos.trailArmPct != null ? pos.trailArmPct : 15;
  const trailGivebackPct = pos.trailGivebackPct != null ? pos.trailGivebackPct : 30;
  const trailArmed = peakPnlPct != null && peakPnlPct >= trailArmPct;
  const trailFloor = trailArmed ? peakPnlPct * (1 - trailGivebackPct/100) : null;
  const trailTriggered = trailArmed && pnlPct != null && pnlPct <= trailFloor;

  // Decay trigger: fires when the stock move required to offset theta is large relative
  // to the stock's own typical daily move (self-calibrating — scales with the contract's
  // own IV, not a flat percentage) AND most of the price is still time value.
  const decayMoveRatioThreshold = pos.decayMoveRatioThreshold != null ? pos.decayMoveRatioThreshold : 1.5;
  const decayExtrinsicMinPct = pos.decayExtrinsicMinPct != null ? pos.decayExtrinsicMinPct : 60;
  const decayTriggered = thetaInfo && thetaInfo.moveRatio != null && thetaInfo.extrinsicSharePct != null
    && thetaInfo.moveRatio >= decayMoveRatioThreshold && thetaInfo.extrinsicSharePct >= decayExtrinsicMinPct;

  if(pnlPct!=null && pnlPct >= pos.tpPct){
    verdict = 'Close — take-profit target reached';
    cls = 'close-win'; tagCls='win';
    detail = `At $${fmt(mark)}, up ${fmt(pnlPct,1)}% — at or past your $${fmt(tpPrice)} target.`;
  } else if(pnlPct!=null && pnlPct <= pos.slPct){
    verdict = 'Close — stop-loss triggered';
    cls = 'close-loss'; tagCls='loss';
    detail = `At $${fmt(mark)}, down ${fmt(pnlPct,1)}% — at or past your $${fmt(slPrice)} stop.`;
  } else if(trailTriggered){
    verdict = 'Close — trailing stop (protecting gains)';
    cls = 'close-win'; tagCls='trail';
    const givebackActual = peakPnlPct > 0 ? (1 - pnlPct/peakPnlPct)*100 : 0;
    detail = `Peaked at +${fmt(peakPnlPct,1)}%, now ${pnlPct>=0?'+':''}${fmt(pnlPct,1)}% — a ${fmt(givebackActual,0)}% giveback from the high, past your ${trailGivebackPct}% trailing-stop rule. Consider locking in $${fmt(mark)} instead of riding it back toward the original stop.`;
  } else if(decayTriggered){
    verdict = 'Close / reassess — decay is outweighing the odds';
    cls = 'close-loss'; tagCls='caution';
    detail = `Theta needs a $${fmt(thetaInfo.requiredDailyMove)}/day move just to break even — that's ${fmt(thetaInfo.moveRatio,1)}x the stock's own typical day (~$${fmt(thetaInfo.expectedDailyMove)}, from ${fmt(thetaInfo.sigmaPctUsed,1)}% vol), and ${fmt(thetaInfo.extrinsicSharePct,0)}% of the price is still time value. The bar to just stay flat is now unusually high.`;
  } else if(dte <= 10){
    verdict = 'Close / reassess — very close to expiration';
    cls = 'close-loss'; tagCls='caution';
    detail = `${dte} days to expiration, currently $${fmt(mark)}. Theta decay is steepest here regardless of P&L.`;
  } else if(dte <= 21){
    verdict = 'Caution — entering the fast time-decay window';
    cls = 'caution'; tagCls='caution';
    detail = `${dte} days to expiration, currently $${fmt(mark)} (target $${fmt(tpPrice)} / stop $${fmt(slPrice)}). No exit trigger yet, but check this daily from here.`;
  } else {
    verdict = 'Hold — within plan, no exit trigger';
    cls = 'hold'; tagCls='hold';
    detail = `${dte} days to expiration, currently $${fmt(mark)} (target $${fmt(tpPrice)} / stop $${fmt(slPrice)}). Sticking to the plan.`;
  }

  if(moneyness){
    detail += ` ${moneyness.state}${moneyness.state!=='ATM' ? ' by $'+fmt(moneyness.diff) : ''}.`;
  }

  const spread = (entry.bid!=null && entry.ask!=null) ? (entry.ask - entry.bid) : null;
  const spreadPct = (spread!=null && mark) ? (spread/mark)*100 : null;
  let note = null;
  if(spreadPct!=null && spreadPct > 15){
    note = `Wide bid/ask spread (${fmt(spreadPct,0)}% of mark) — use a limit order, not market, if you act on this.`;
  }
  return {mark, pnlPct, dte, moneyness, peakPnlPct, trailArmed, trailFloor, trailArmPct, trailGivebackPct,
    thetaInfo, decayTriggered, decayMoveRatioThreshold, decayExtrinsicMinPct, verdict, cls, tagCls, detail, note};
}

// Modeled $/day decay via Black-Scholes: reprices the same contract with one fewer day
// to expiration, holding stock price and vol constant, and diffs the two theoretical
// prices. Also converts theta into a "required daily move" via the option's own modeled
// delta, and compares that to the stock's own typical daily move (from the same vol
// input) — a self-calibrating ratio instead of an arbitrary flat percentage threshold.
// Requires blackScholesPrice/blackScholesDelta (declared later as function statements,
// so they're hoisted and safe to call here).
function computeThetaInfo(pos, entry, dte, mark, sigmaPctOverride){
  const sigmaPct = sigmaPctOverride != null ? sigmaPctOverride : entry.iv;
  if(entry.stockPrice == null || sigmaPct == null || !dte || dte <= 0) return null;
  const S = entry.stockPrice, K = pos.strike, sigma = sigmaPct/100, r = 0.045;
  const T0 = dte/365;
  const T1 = Math.max(dte-1, 0)/365;
  const modelPrice0 = blackScholesPrice(S, K, T0, sigma, r, pos.side);
  const modelPrice1 = blackScholesPrice(S, K, T1, sigma, r, pos.side);
  const thetaPerDay = Math.max(modelPrice0 - modelPrice1, 0);
  const intrinsic = pos.side === 'Call' ? Math.max(S-K, 0) : Math.max(K-S, 0);
  const extrinsic = Math.max(modelPrice0 - intrinsic, 0);
  const basisPrice = mark != null ? mark : modelPrice0;
  const thetaPctOfMarkPerDay = basisPrice > 0 ? (thetaPerDay/basisPrice)*100 : null;
  const extrinsicSharePct = modelPrice0 > 0 ? (extrinsic/modelPrice0)*100 : null;

  // Required daily move: how much the stock needs to move (in $) for delta-driven gain
  // to offset theta. Expected daily move: the stock's own ~1-sigma daily move, derived
  // from the same vol input. moveRatio > 1 means you need a bigger-than-typical day just
  // to tread water — and it scales automatically with the contract's own IV, unlike a
  // fixed percentage.
  const modelDelta = blackScholesDelta(S, K, T0, sigma, r, pos.side);
  const dailyVolPct = sigma / Math.sqrt(365) * 100;
  const expectedDailyMove = S * (dailyVolPct/100);
  const requiredDailyMove = Math.abs(modelDelta) > 0.001 ? thetaPerDay/Math.abs(modelDelta) : null;
  const moveRatio = (requiredDailyMove != null && expectedDailyMove > 0) ? requiredDailyMove/expectedDailyMove : null;

  return {thetaPerDay, modelPrice0, intrinsic, extrinsic, thetaPctOfMarkPerDay, extrinsicSharePct,
    sigmaPctUsed: sigmaPct, ivSource: sigmaPctOverride == null ? 'logged' : (entry.iv != null ? 'logged' : 'fallback'),
    modelDelta, expectedDailyMove, requiredDailyMove, moveRatio};
}

// Heuristic read on recent momentum in the logged data — not a prediction,
// just a nudge based on how the last few checkpoints have been trending.
function computeAdjustment(pos, sortedEntries){
  const pts = sortedEntries
    .map(e => ({...e, pnlPct: evaluate(pos, e).pnlPct}))
    .filter(e => e.pnlPct != null);

  if(pts.length < 2){
    return {tag:'none', text:'Not enough checkpoints yet to read a trend — need at least two logged entries.'};
  }

  const recent = pts.slice(-4); // up to last 4 checkpoints, roughly the last day or so
  const first = recent[0].pnlPct;
  const last = recent[recent.length-1].pnlPct;
  const steps = recent.length - 1;
  const slope = steps > 0 ? (last - first) / steps : 0;

  const tpPct = pos.tpPct;
  const slPct = pos.slPct; // negative
  const progressToTP = tpPct ? last / tpPct : 0;       // 0..1+ as it nears/passes TP
  const progressToSL = slPct ? last / slPct : 0;        // 0..1+ as it nears/passes SL (both negative → positive ratio)

  if(last >= 0 && progressToTP >= 0.5 && slope > 2){
    return {
      tag:'raise',
      text:`Trending up and already ${fmt(progressToTP*100,0)}% of the way to your take-profit, with momentum still building (~${fmt(slope,1)} pts/checkpoint). Worth considering a trailing stop or a higher TP instead of closing right at the original target, if you want to let it keep running.`
    };
  }
  if(last < 0 && progressToSL >= 0.5 && slope < -2){
    return {
      tag:'tighten',
      text:`Trending down and already ${fmt(progressToSL*100,0)}% of the way to your stop-loss, with the decline accelerating (~${fmt(slope,1)} pts/checkpoint). Worth considering cutting a bit earlier rather than riding it all the way to the original stop.`
    };
  }
  if(Math.abs(slope) < 1){
    return {tag:'none', text:'Premium has been roughly flat across recent checkpoints — no clear momentum either way, original plan still looks fine.'};
  }
  return {tag:'none', text:'No strong enough trend yet to suggest changing your plan — sticking with your original TP/SL.'};
}

  const ids = Object.keys(state.positions);

  let html = `

      <button class="top-tab ${state.view==='account'?'active':''}" onclick="setView('account')">Account Size</button>
    </div>`;

  if(state.view === 'account'){
    html += renderAccountView();
    app.innerHTML = html;
    if(state.accountLog.length) drawAccountChart();
    return;
  }

  html += `<div class="positions-row">`;

  for(const id of ids){
    const p = state.positions[id];
    const dotColor = p.status === 'closed' ? '#5b6270' : 'var(--accent)';
    html += `<div class="pos-chip ${id===state.activeId?'active':''}" onclick="selectPosition('${id}')">
      <span class="dot" style="background:${dotColor}"></span>${p.ticker || 'Untitled'} ${p.strike?('$'+p.strike):''} ${p.side||''}
    </div>`;
  }
  html += `<div class="btn-new" onclick="newPosition()">+ New position</div></div>`;

  const pos = state.activeId ? state.positions[state.activeId] : null;

  if(!pos){
    html += renderSetupForm(null);
    app.innerHTML = html;
    return;
  }

  const entries = sortEntries(state.entries[pos.id] || []);
  const peakSeries = computePeakSeries(pos, entries);
  const latest = entries[entries.length-1];
  const latestPeak = peakSeries.length ? peakSeries[peakSeries.length-1] : null;
  // Fallback vol for theta modeling when a checkpoint has no logged IV — same historical-vol
  // computation the Predictive Targets card uses, so the two stay consistent with each other.
  const hvForTheta = computeHistoricalVol(trimHistorical(state.historical[pos.id] || [], pos.histLookbackDays));
  const fallbackSigmaForTheta = hvForTheta ? hvForTheta.annualizedPct : null;
  const sigmaForLatest = latest ? (latest.iv != null ? latest.iv : fallbackSigmaForTheta) : null;
  const latestEval = latest ? evaluate(pos, latest, latestPeak, sigmaForLatest) : null;
  const adj = (entries.length && pos.status !== 'closed') ? computeAdjustment(pos, entries) : null;
  const sim = simCache[pos.id];
  const simIsCurrent = sim && !sim.error && latest && sim.runOnEntryKey === (latest.date + '|' + latest.time);

  // Trailing-stop status line — shown whenever there's at least one entry, regardless of
  // whether it has triggered yet, so you can see how far it is from arming/firing.
  let trailStatus = null;
  if(latest && pos.status !== 'closed'){
    const trailArmPct = pos.trailArmPct != null ? pos.trailArmPct : 15;
    const trailGivebackPct = pos.trailGivebackPct != null ? pos.trailGivebackPct : 30;
    if(latestPeak == null){
      trailStatus = `Not armed yet — no profitable checkpoints logged.`;
    } else if(latestPeak < trailArmPct){
      trailStatus = `Not armed yet — arms once P&L reaches +${fmt(trailArmPct,0)}% (peaked at ${latestPeak>=0?'+':''}${fmt(latestPeak,1)}% so far).`;
    } else {
      const floor = latestPeak * (1 - trailGivebackPct/100);
      trailStatus = `Armed — peaked at +${fmt(latestPeak,1)}%, will trigger a close signal if P&L drops to ${floor>=0?'+':''}${fmt(floor,1)}% (a ${trailGivebackPct}% giveback from the high).`;
    }
  }

  // IV context — compares the latest logged IV to the first logged IV for this position
  // (a rough "entry IV"), so a stalling premium can be read as vol crush vs. no stock move.
  let ivContext = null;
  if(latest && latest.iv != null){
    const firstWithIv = entries.find(e => e.iv != null);
    if(firstWithIv && firstWithIv !== latest){
      const ivDelta = latest.iv - firstWithIv.iv;
      ivContext = `IV now ${fmt(latest.iv,1)}%, vs ${fmt(firstWithIv.iv,1)}% at first logged entry (${ivDelta>=0?'+':''}${fmt(ivDelta,1)} pts). ${Math.abs(ivDelta) >= 5 ? (ivDelta<0 ? 'A drop this size can stall premium even if the stock is cooperating.' : 'A rise this size can inflate premium even without much stock movement.') : ''}`;

// --- Historical volatility (optional cross-check against logged IV) ---
// Accepts either a simple "date,close" per line paste, or a typical exported CSV
// with a header row and multiple columns (Date, Open, High, Low, Close, Adj Close,
// Volume — the usual Yahoo Finance / broker export shape). Header detection picks
// the Date column and prefers Adj Close over Close over the second column.
// Computes annualized volatility from the standard deviation of daily log returns.
function parseHistoricalCSV(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(!lines.length) return [];

  const splitLine = l => l.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
  const firstCols = splitLine(lines[0]);
  const looksLikeHeader = firstCols.some(c => /date|close|open|high|low|volume|adj/i.test(c));

  let dateIdx = 0, closeIdx = 1, dataLines = lines;
  if(looksLikeHeader){
    dataLines = lines.slice(1);
    const lower = firstCols.map(c=>c.toLowerCase());
    const dIdx = lower.findIndex(c => c.includes('date'));
    const adjIdx = lower.findIndex(c => c.includes('adj close') || c.includes('adj. close') || c==='adjclose');
    const cIdx = lower.findIndex(c => c==='close' || (c.includes('close') && !c.includes('adj')));
    dateIdx = dIdx >= 0 ? dIdx : 0;
    closeIdx = adjIdx >= 0 ? adjIdx : (cIdx >= 0 ? cIdx : 1);
  }

  const rows = [];
  for(const line of dataLines){
    const parts = splitLine(line);
    if(parts.length < 2){
      const close = parseFloat(parts[0].replace(/[^0-9.\-]/g,''));
      if(!isNaN(close)) rows.push({date:null, close});
      continue;
    }
    const rawDate = parts[dateIdx];
    const date = rawDate && !isNaN(Date.parse(rawDate)) ? rawDate : null;
    const close = parseFloat((parts[closeIdx]||'').replace(/[^0-9.\-]/g,''));
    if(!isNaN(close)) rows.push({date, close});
  }
  // if dates are present and parseable, sort ascending by date; otherwise keep input order
  const allDated = rows.length>0 && rows.every(r => r.date);
  if(allDated) rows.sort((a,b)=> new Date(a.date) - new Date(b.date));
  return rows;
}

function computeHistoricalVol(closes){
  const prices = closes.map(r=>r.close).filter(v=>v>0);
  if(prices.length < 6) return null; // need a reasonable minimum sample
  const logReturns = [];
  for(let i=1;i<prices.length;i++){
    logReturns.push(Math.log(prices[i]/prices[i-1]));
  }
  const mean = logReturns.reduce((a,b)=>a+b,0)/logReturns.length;
  const variance = logReturns.reduce((a,b)=>a+(b-mean)*(b-mean),0)/(logReturns.length-1);
  const dailyStdev = Math.sqrt(variance);
  const annualizedPct = dailyStdev * Math.sqrt(252) * 100;
  return {annualizedPct, sampleSize: prices.length};
}

// Historical arrays are stored oldest-first (parseHistoricalCSV sorts ascending when
// dates are present), so the most recent N entries are simply the last N in the array —
// this keeps the volatility estimate reflecting recent behavior even if a full multi-year
// history was uploaded.
function trimHistorical(hist, lookbackDays){
  const n = lookbackDays && lookbackDays > 0 ? lookbackDays : 60;
  return hist.slice(-n);
}

async function updateHistLookback(posId, value){
  const n = parseInt(value);
  state.positions[posId].histLookbackDays = isNaN(n) || n < 6 ? 60 : n;
  await savePositions();
  render();
}

function handleHistFileUpload(posId){
  const input = document.getElementById('hist-file');
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    document.getElementById('hist-input').value = e.target.result;
    input.value = ''; // reset so picking the same file again still fires change
  };
  reader.onerror = () => alert('Could not read that file — try re-exporting it as a plain CSV.');
  reader.readAsText(file);
}

// --- Monte Carlo simulation (GBM price paths, Black-Scholes repricing at a chosen
// evaluation horizon, percentile-based targets) ---
// Uses the position's strike/side/expiration, the latest logged stock price and a
// volatility input, plus a risk-free rate assumption, to simulate a range of possible
// stock prices at a near-term horizon (not necessarily expiration), then reprices the
// option at each simulated price with Black-Scholes so the distribution retains time
// value instead of collapsing to a hard $0/large-payoff split. This is a probability
// model, not a direction forecast — it assumes lognormal returns (standard GBM) and
// says nothing about news, earnings, or gaps, which is why it's an input to your
// judgment, not a replacement for it.
function randn(){
  let u=0, v=0;
  while(u===0) u = Math.random();
  while(v===0) v = Math.random();
  return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}

function percentile(sortedArr, p){
  if(sortedArr.length === 0) return null;
  const idx = (p/100) * (sortedArr.length - 1);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if(lo === hi) return sortedArr[lo];
  return sortedArr[lo] + (sortedArr[hi]-sortedArr[lo]) * (idx-lo);
}

// Standard normal CDF (Abramowitz & Stegun 7.1.26 approximation, ~7 decimal accuracy)
function normCDF(x){
  const sign = x < 0 ? -1 : 1;
  const ax = Math.abs(x)/Math.SQRT2;
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const t = 1/(1+p*ax);
  const y = 1 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-ax*ax);
  return 0.5*(1+sign*y);
}

// Black-Scholes option value. T is the time (in years) remaining until the option's
// actual expiration, evaluated at stock price S. When T<=0, this is just intrinsic value.
function blackScholesPrice(S, K, T, sigma, r, side){
  if(T <= 0 || sigma <= 0){
    return side==='Call' ? Math.max(S-K,0) : Math.max(K-S,0);
  }
  const sqrtT = Math.sqrt(T);
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*sqrtT);
  const d2 = d1 - sigma*sqrtT;
  if(side === 'Call'){
    return S*normCDF(d1) - K*Math.exp(-r*T)*normCDF(d2);
  }
  return K*Math.exp(-r*T)*normCDF(-d2) - S*normCDF(-d1);
}

// Black-Scholes delta (analytic, from the same d1 used in blackScholesPrice). Used to
// convert theta ($/day) into a required stock move ($/day) — no logged delta needed.
function blackScholesDelta(S, K, T, sigma, r, side){
  if(T <= 0 || sigma <= 0){
    const itm = side==='Call' ? S > K : S < K;
    return side==='Call' ? (itm?1:0) : (itm?-1:0);
  }
  const sqrtT = Math.sqrt(T);
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*sqrtT);
  return side === 'Call' ? normCDF(d1) : normCDF(d1) - 1;
}

// Simulates the stock forward `horizonDays` (GBM), repricing the option at every step
// (not just the end) with Black-Scholes using the correctly-shrinking time-to-expiration.
// Tracks each path's running high and low, not just its terminal value, so the caller can
// report "likely peak/trough reached at any point in the window" — distinct from, and
// usually wider than, the terminal-outcome distribution.
function runMonteCarlo(S0, strike, side, horizonDays, remainingDays, sigma, r, nPaths){
  const Thorizon = horizonDays/365;
  const Tremaining = remainingDays/365;
  const nSteps = Math.max(1, Math.min(horizonDays, 60));
  const dt = Thorizon/nSteps;
  const values = new Array(nPaths);
  const maxValues = new Array(nPaths);
  const minValues = new Array(nPaths);
  const samplePaths = [];
  const sampleCount = Math.min(25, nPaths);
  for(let p=0; p<nPaths; p++){
    let S = S0;
    const storeThis = p < sampleCount;
    const path = storeThis ? [S] : null;
    let runningMax = blackScholesPrice(S, strike, Tremaining + Thorizon, sigma, r, side);
    let runningMin = runningMax;
    for(let s=0; s<nSteps; s++){
      const Z = randn();
      S = S * Math.exp((r - 0.5*sigma*sigma)*dt + sigma*Math.sqrt(dt)*Z);
      if(storeThis) path.push(S);
      const elapsedT = dt*(s+1);
      const remainingT = Math.max(Thorizon - elapsedT, 0) + Tremaining;
      const stepValue = blackScholesPrice(S, strike, remainingT, sigma, r, side);
      if(stepValue > runningMax) runningMax = stepValue;
      if(stepValue < runningMin) runningMin = stepValue;
    }
    if(storeThis) samplePaths.push(path);
    values[p] = blackScholesPrice(S, strike, Tremaining, sigma, r, side);
    maxValues[p] = runningMax;
    minValues[p] = runningMin;
  }
  return {values, maxValues, minValues, samplePaths, nSteps};
}

function computePredictiveTargets(pos, entry, confidenceBand, rfRatePct, nPaths, sigmaPctOverride, horizonDaysOverride){
  const sigmaPct = sigmaPctOverride != null ? sigmaPctOverride : entry.iv;
  if(entry.stockPrice == null || sigmaPct == null) return {error:'missing-inputs'};
  const dte = daysBetween(entry.date, pos.expiration);
  if(dte <= 0) return {error:'expired'};

  const horizonDays = Math.max(1, Math.min(horizonDaysOverride || dte, dte));
  const remainingDays = dte - horizonDays;
  const sigma = sigmaPct/100;
  const r = rfRatePct/100;
  const {values, maxValues, minValues, samplePaths} = runMonteCarlo(entry.stockPrice, pos.strike, pos.side, horizonDays, remainingDays, sigma, r, nPaths);
  const pctValues = values
    .map(v => ((v - pos.entryPremium)/pos.entryPremium)*100)
    .sort((a,b)=>a-b);
  const maxPctValues = maxValues
    .map(v => ((v - pos.entryPremium)/pos.entryPremium)*100)
    .sort((a,b)=>a-b);
  const minPctValues = minValues
    .map(v => ((v - pos.entryPremium)/pos.entryPremium)*100)
    .sort((a,b)=>a-b);

  const lowP = (100-confidenceBand)/2;
  const highP = 100 - lowP;
  const slRaw = percentile(pctValues, lowP);
  const tp = percentile(pctValues, highP);
  const sl = Math.max(slRaw, -100); // can't lose more than the premium paid
  const median = percentile(pctValues, 50);
  const mean = pctValues.reduce((a,b)=>a+b,0)/pctValues.length;
  const probProfit = (pctValues.filter(v=>v>0).length/pctValues.length)*100;

  // "Likely peak/trough" — the best/worst point reached at ANY point during the horizon,
  // not just where the price lands at the end. Framed one-sided at the same confidence
  // level: likelyMaxReach is the value X% of paths reach or exceed at their high; 
  // likelyMinReach is the value X% of paths reach or fall below at their low.
  const likelyMaxReach = percentile(maxPctValues, 100-confidenceBand);
  const likelyMinReachRaw = percentile(minPctValues, confidenceBand);
  const likelyMinReach = Math.max(likelyMinReachRaw, -100);

  return {tp, sl, median, mean, probProfit, likelyMaxReach, likelyMinReach, dte, horizonDays, remainingDays,
    sigmaPct: sigma*100, pctPayoffs: pctValues, samplePaths, S0: entry.stockPrice};
}

let simCache = {}; // posId -> last computed sim result, transient (not persisted)
let uiState = { detailsOpen: {} }; // posId -> whether the banner's "details" section is expanded, transient (not persisted)

async function runSimulation(posId){
  const pos = state.positions[posId];
  const entries = sortEntries(state.entries[posId] || []);
  const latest = entries[entries.length-1];
  if(!latest){ return; }
  const band = parseInt(document.getElementById('sim-band').value);
  const rf = parseFloat(document.getElementById('sim-rf').value);
  const volSource = document.getElementById('sim-vol-source').value;
  const horizonInput = parseInt(document.getElementById('sim-horizon').value);

  const hv = computeHistoricalVol(trimHistorical(state.historical[posId] || [], pos.histLookbackDays));
  let sigmaPct = null;
  if(volSource === 'iv'){
    sigmaPct = latest.iv;
  } else if(volSource === 'hv'){
    if(!hv){ simCache[posId] = {error:'no-historical'}; render(); return; }
    sigmaPct = hv.annualizedPct;
  } else if(volSource === 'blend'){
    if(latest.iv == null && !hv){ simCache[posId] = {error:'missing-inputs'}; render(); return; }
    if(latest.iv != null && hv) sigmaPct = (latest.iv + hv.annualizedPct)/2;
    else sigmaPct = latest.iv != null ? latest.iv : hv.annualizedPct;
  }

  const result = computePredictiveTargets(pos, latest, band, isNaN(rf)?4.5:rf, 3000, sigmaPct, horizonInput);
  if(!result.error){
    result.band = band;
    result.volSourceLabel = volSource==='iv' ? 'implied vol' : volSource==='hv' ? 'historical vol' : 'blended vol';
    result.runOnEntryKey = latest.date + '|' + latest.time; // which checkpoint this sim reflects
  }
  simCache[posId] = result;
  render();
}

async function applySuggestedTargets(posId){
  const result = simCache[posId];
  if(!result || result.error) return;
  state.positions[posId].tpPct = Math.round(result.tp);
  state.positions[posId].slPct = Math.round(result.sl);
  await savePositions();
  simCache[posId] = null;
  render();
}

async function savePosition(existingId){
  const ticker = document.getElementById('s-ticker').value.trim().toUpperCase();
  const side = document.getElementById('s-side').value;
  const strike = parseFloat(document.getElementById('s-strike').value);
  const expiration = document.getElementById('s-exp').value;
  const entryDate = document.getElementById('s-entrydate').value;
  const contracts = parseInt(document.getElementById('s-contracts').value) || 1;
  const entryPremium = parseFloat(document.getElementById('s-premium').value);
  const tpPct = parseFloat(document.getElementById('s-tp').value);
  const slPct = parseFloat(document.getElementById('s-sl').value);
  const trailArmInput = parseFloat(document.getElementById('s-trail-arm').value);
  const trailGivebackInput = parseFloat(document.getElementById('s-trail-giveback').value);
  const decayRatioInput = parseFloat(document.getElementById('s-decay-ratio').value);
  const decayExtrinsicInput = parseFloat(document.getElementById('s-decay-extrinsic').value);

  if(!ticker || !expiration || !entryDate || isNaN(entryPremium)){
    alert('Please fill in at least ticker, expiration, entry date, and entry premium.');
    return;
  }

  const id = existingId || uid();
  state.positions[id] = {
    id, ticker, side, strike, expiration, entryDate, contracts,
    entryPremium, tpPct, slPct,
    trailArmPct: isNaN(trailArmInput) ? 15 : trailArmInput,
    trailGivebackPct: isNaN(trailGivebackInput) ? 30 : trailGivebackInput,
    decayMoveRatioThreshold: isNaN(decayRatioInput) ? 1.5 : decayRatioInput,
    decayExtrinsicMinPct: isNaN(decayExtrinsicInput) ? 60 : decayExtrinsicInput,
    status: (state.positions[id] && state.positions[id].status) || 'open'
  };
  if(!state.entries[id]) state.entries[id] = [];
  if(!state.historical[id]) state.historical[id] = [];
  state.activeId = id;
  await savePositions();
  await saveActiveId();
  render();
}

async function deletePosition(id){
  if(!confirm('Delete this position and all its logged entries? This cannot be undone.')) return;
  delete state.positions[id];
  delete state.entries[id];
  delete state.historical[id];
  try{ await S.delete('entries:' + id, false); }catch(e){}
  try{ await S.delete('historical:' + id, false); }catch(e){}
  const ids = Object.keys(state.positions);
  state.activeId = ids[0] || null;
  if(state._closingId === id) state._closingId = null;
  await savePositions();
  await saveActiveId();
  render();
}

async function confirmClosePosition(id){
  const pos = state.positions[id];
  const exitDate = document.getElementById('close-date').value || todayStr();
  const exitPrice = parseFloat(document.getElementById('close-price').value);
  if(isNaN(exitPrice)){ alert('Enter the price you exited at.'); return; }

  const perShare = exitPrice - pos.entryPremium;
  const realizedPL = perShare * pos.contracts * 100;
  const realizedPct = pos.entryPremium ? (perShare/pos.entryPremium)*100 : null;

  state.tradeHistory.push({
    id: uid(), positionId: id, ticker: pos.ticker, side: pos.side, strike: pos.strike,
    expiration: pos.expiration, entryDate: pos.entryDate, exitDate,
    entryPremium: pos.entryPremium, exitPremium: exitPrice, contracts: pos.contracts,
    realizedPL, realizedPct
  });
  await saveTradeHistory();

  pos.status = 'closed';
  state._closingId = null;
  await savePositions();
  render();
}

  render();
}

async function addEntry(){
  const pos = state.positions[state.activeId];
  const date = document.getElementById('in-date').value || todayStr();
  const time = document.getElementById('in-time').value || TIME_SLOTS[0];
  const stockPrice = parseFloat(document.getElementById('in-stock').value);
  const bid = parseFloat(document.getElementById('in-bid').value);
  const ask = parseFloat(document.getElementById('in-ask').value);
  const iv = parseFloat(document.getElementById('in-iv').value);
  const delta = parseFloat(document.getElementById('in-delta').value);
  const notes = document.getElementById('in-notes').value.trim();

  if(isNaN(bid) && isNaN(ask)){
    alert('Enter at least a bid or an ask for the option.');
    return;
  }

  const entry = {
    date,
    time,
    stockPrice: isNaN(stockPrice) ? null : stockPrice,
    bid: isNaN(bid) ? null : bid,
    ask: isNaN(ask) ? null : ask,
    iv: isNaN(iv) ? null : iv,
    delta: isNaN(delta) ? null : delta,
    notes: notes || null
  };

  if(!state.entries[pos.id]) state.entries[pos.id] = [];
  const existingIdx = state.entries[pos.id].findIndex(e => e.date === date && e.time === time);
  if(existingIdx >= 0) state.entries[pos.id][existingIdx] = entry;
  else state.entries[pos.id].push(entry);

  simCache[pos.id] = null; // new data logged — old simulation is stale
  await saveEntries(pos.id);
  render();
}

async function deleteEntry(posId, idx){
  const entries = sortEntries(state.entries[posId]||[]);
  const target = entries[idx];
  state.entries[posId] = state.entries[posId].filter(e => !(e.date === target.date && e.time === target.time));
  await saveEntries(posId);
  render();
}

      ${hist.length ? `<button class="ghost danger" onclick="clearHistoricalInput('${pos.id}')">Clear</button>` : ''}
    </div>
    <div class="adj-text" style="margin-top:6px;">
      ${hv ? `Using the most recent ${trimmedHist.length} of ${hist.length} uploaded closes: ${fmt(hv.annualizedPct,1)}% annualized historical volatility.`
           : hist.length ? `Need at least 6 valid closes in the lookback window to compute a volatility estimate (currently have ${trimmedHist.length} of ${hist.length} uploaded).`
           : `Upload a CSV — a full multi-year history is fine, it'll automatically use just the lookback window above for the actual volatility read. Handles typical exports with a Date and Close/Adj Close column, or paste "date,close" rows manually.`}
    </div>
  </div>`;

  return `<div class="card">
    <h2>Predictive targets (Monte Carlo)</h2>
    ${body}
  </div>`;
}

// --- Chart tooltips ---
// Generic point-hover tooltip: finds the nearest {x,y,html} point to the cursor (by pixel
// distance) and shows its html in the sibling tooltip div, clamped inside the canvas.
function attachPointTooltip(canvas, tooltip, points){
  if(!canvas || !tooltip) return;
  canvas.onmousemove = (evt) => {
    if(!points.length){ tooltip.style.display='none'; return; }
    const rect = canvas.getBoundingClientRect();
    const mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
    let nearest = points[0], nearestDist = Infinity;
    for(const p of points){
      const dist = Math.hypot(p.x-mx, (p.y!=null?p.y-my:0));
      if(dist < nearestDist){ nearestDist = dist; nearest = p; }
    }
    if(nearestDist > 45){ tooltip.style.display='none'; return; }
    tooltip.innerHTML = nearest.html;
    tooltip.style.display = 'block';
    let left = mx + 12, top = my - 10;
    const maxLeft = canvas.clientWidth - tooltip.offsetWidth - 4;
    if(left > maxLeft) left = mx - tooltip.offsetWidth - 12;
    if(left < 0) left = 4;
    const maxTop = canvas.clientHeight - tooltip.offsetHeight - 4;
    if(top > maxTop) top = maxTop;
    if(top < 0) top = 4;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
  };
  canvas.onmouseleave = () => { tooltip.style.display = 'none'; };
}

// Bar-hover tooltip for the histogram: maps cursor x to a bin range rather than a
// nearest point, since bars (not discrete points) fill the whole plot width.
function attachBarTooltip(canvas, tooltip, bins, pad, plotW, min, max, nBins, total){
  if(!canvas || !tooltip) return;
  canvas.onmousemove = (evt) => {
    const rect = canvas.getBoundingClientRect();
    const mx = evt.clientX - rect.left, my = evt.clientY - rect.top;
    if(mx < pad || mx > pad+plotW){ tooltip.style.display='none'; return; }
    let idx = Math.floor(((mx-pad)/plotW)*nBins);
    if(idx < 0) idx = 0; if(idx >= nBins) idx = nBins-1;
    const binMin = min + (idx/nBins)*(max-min);
    const binMax = min + ((idx+1)/nBins)*(max-min);
    const count = bins[idx];
    const pct = total ? (count/total*100) : 0;
    tooltip.innerHTML = `<div class="tt-title">${fmt(binMin,1)}% to ${fmt(binMax,1)}%</div><div class="tt-muted">${count} of ${total} paths (${fmt(pct,1)}%)</div>`;
    tooltip.style.display = 'block';
    let left = mx + 12;
    const maxLeft = canvas.clientWidth - tooltip.offsetWidth - 4;
    if(left > maxLeft) left = mx - tooltip.offsetWidth - 12;
    tooltip.style.left = Math.max(left,4) + 'px';
    tooltip.style.top = Math.max(my - 40, 4) + 'px';
  };
  canvas.onmouseleave = () => { tooltip.style.display = 'none'; };
}

function drawHistogram(pos, result){
  const canvas = document.getElementById('sim-hist');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 130;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const data = result.pctPayoffs;
  const min = Math.max(data[0], -100);
  const max = data[data.length-1];
  const range = (max-min) || 1;
  const nBins = 40;
  const bins = new Array(nBins).fill(0);
  data.forEach(v=>{
    const clamped = Math.max(min, Math.min(max, v));
    let idx = Math.floor(((clamped-min)/range)*nBins);
    if(idx>=nBins) idx = nBins-1;
    if(idx<0) idx = 0;
    bins[idx]++;
  });
  const maxBin = Math.max(...bins);
  const pad = 10, plotW = w - pad*2, plotH = h - pad*2;
  const barW = plotW/nBins;

  ctx.fillStyle = '#2c3a52';
  bins.forEach((count,i)=>{
    const bh = (count/maxBin)*plotH;
    ctx.fillRect(pad + i*barW, pad + (plotH-bh), Math.max(barW-1,1), bh);
  });

  function xAt(v){ return pad + ((Math.max(min,Math.min(max,v))-min)/range)*plotW; }

  ctx.strokeStyle = '#8b91a1';
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(xAt(0), pad); ctx.lineTo(xAt(0), pad+plotH); ctx.stroke();

  ctx.strokeStyle = '#3ddc97';
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(xAt(result.tp), pad); ctx.lineTo(xAt(result.tp), pad+plotH); ctx.stroke();

  ctx.strokeStyle = '#ff6b6b';
  ctx.beginPath(); ctx.moveTo(xAt(result.sl), pad); ctx.lineTo(xAt(result.sl), pad+plotH); ctx.stroke();

  const total = data.length;
  attachBarTooltip(canvas, document.getElementById('sim-hist-tooltip'), bins, pad, plotW, min, max, nBins, total);
}

let sizeCalcResult = null; // transient, not persisted

function renderPositionSizeCalc(latestAcct){
  const defaultAccount = latestAcct ? latestAcct.value : '';
  let body = `<div class="row3">

    <div class="field"><label>Contract multiplier</label><input type="number" step="1" id="calc-mult" value="100"></div>
  </div>
  <div class="row3">
    <div class="field"><label>Entry price (premium, $/share)</label><input type="number" step="0.01" id="calc-entry" placeholder="e.g. 0.20"></div>
    <div class="field"><label>Stop-loss price ($/share)</label><input type="number" step="0.01" id="calc-stop" placeholder="e.g. 0.13"></div>
    <div class="field" style="display:flex;align-items:flex-end;">
      <button class="primary" style="margin-top:0;width:100%;" onclick="calcPositionSize()">Calculate</button>

  if(sizeCalcResult){
    const r = sizeCalcResult;
    if(r.error){
      body += `<div class="empty" style="margin-top:6px;">${r.error}</div>`;
    } else {
      const overCap = r.contracts === 0;
      body += `
        <div class="row3" style="margin-top:14px;">
          <div><label>Max $ risk allowed</label><div style="font-size:18px;font-weight:600;padding:4px 0;">$${fmt(r.maxRisk)}</div></div>
          <div><label>Risk per contract</label><div style="font-size:18px;font-weight:600;padding:4px 0;">$${fmt(r.riskPerContract)}</div></div>
          <div><label>Recommended contracts</label><div style="font-size:18px;font-weight:600;padding:4px 0;${overCap?'color:var(--red);':''}">${r.contracts}</div></div>
        </div>
        <div class="row3">
          <div><label>Total capital deployed</label><div style="padding:4px 0;color:var(--muted);">$${fmt(r.totalCost)}</div></div>
          <div><label>% of account deployed</label><div style="padding:4px 0;color:var(--muted);">${fmt(r.pctDeployed,1)}%</div></div>
          <div><label>If just 1 contract</label><div style="padding:4px 0;color:var(--muted);">$${fmt(r.riskPerContract)} risk (${fmt(r.oneContractPct,1)}% of account)</div></div>
        </div>
        ${overCap ? `<div class="adj-text" style="margin-top:6px;color:var(--red);">
          Even 1 contract risks ${fmt(r.oneContractPct,1)}% of your account — above your ${r.riskPct}% target. Consider a
          cheaper contract, a tighter stop, or accepting the extra risk deliberately rather than by default.
        </div>` : `<div class="adj-text" style="margin-top:6px;">
          Based on the three-step method: cap your dollar risk at ${r.riskPct}% of account, size to your stop distance,
          and let that set the contract count — not the other way around.
        </div>`}
      `;
    }
  }

  return `<div class="card">
    <h2>Position size calculator</h2>
    ${body}
  </div>`;
}

function calcPositionSize(){
  const account = parseFloat(document.getElementById('calc-account').value);
  const riskPct = parseFloat(document.getElementById('calc-risk-pct').value);
  const mult = parseFloat(document.getElementById('calc-mult').value) || 100;
  const entry = parseFloat(document.getElementById('calc-entry').value);
  const stop = parseFloat(document.getElementById('calc-stop').value);

  if(isNaN(account) || account <= 0){ sizeCalcResult = {error:'Enter a valid account size.'}; render(); return; }
  if(isNaN(riskPct) || riskPct <= 0){ sizeCalcResult = {error:'Enter a valid max risk percentage.'}; render(); return; }
  if(isNaN(entry) || isNaN(stop)){ sizeCalcResult = {error:'Enter both an entry price and a stop-loss price.'}; render(); return; }
  if(stop >= entry){ sizeCalcResult = {error:'Stop-loss price should be below entry price (this assumes buying calls/puts long).'}; render(); return; }

  const maxRisk = account * (riskPct/100);
  const riskPerContract = (entry - stop) * mult;
  const contracts = Math.floor(maxRisk / riskPerContract);
  const totalCost = contracts * entry * mult;
  const pctDeployed = account ? (totalCost/account)*100 : 0;
  const oneContractRiskPct = account ? (riskPerContract/account)*100 : 0;

  sizeCalcResult = {maxRisk, riskPerContract, contracts, totalCost, pctDeployed, riskPct, oneContractPct: oneContractRiskPct};
  render();
}

function renderMonthlyGoalCard(){
  const trades = state.tradeHistory || [];
  const MIN_TRADES = 5;

  if(trades.length < MIN_TRADES){
    return `<div class="card">
      <h2>Monthly goal (from your trading history)</h2>
      <div class="empty">Log at least ${MIN_TRADES} closed trades with an exit price to get a data-driven monthly goal
        — currently have ${trades.length}. Use "Mark closed" on a position and enter what you actually exited at to build this.</div>
    </div>`;
  }

  const wins = trades.filter(t=>t.realizedPL>0).length;
  const winRate = (wins/trades.length)*100;
  const avgPL = trades.reduce((a,t)=>a+t.realizedPL,0)/trades.length;
  const avgPct = trades.reduce((a,t)=>a+(t.realizedPct||0),0)/trades.length;

  const entryDates = trades.map(t=>new Date(t.entryDate)).sort((a,b)=>a-b);
  const exitDates = trades.map(t=>new Date(t.exitDate)).sort((a,b)=>a-b);
  const daySpan = Math.max(1, Math.round((exitDates[exitDates.length-1] - entryDates[0]) / 86400000));
  const monthsSpan = Math.max(daySpan/30, 7/30); // floor at ~1 week so early data doesn't explode the pace
  const tradesPerMonth = trades.length / monthsSpan;
  const monthlyDollarGoal = avgPL * tradesPerMonth;

  const acctLog = sortAccountLog();
  const latestAcct = acctLog[acctLog.length-1];
  const monthlyPctGoal = latestAcct && latestAcct.value ? (monthlyDollarGoal/latestAcct.value)*100 : null;
  const goalClass = monthlyDollarGoal >= 0 ? 'pnl-pos' : 'pnl-neg';

  return `<div class="card">
    <h2>Monthly goal (from your trading history)</h2>
    <div class="row3">
      <div><label>Trades logged</label><div style="padding:4px 0;">${trades.length}</div></div>
      <div><label>Win rate</label><div style="padding:4px 0;">${fmt(winRate,0)}%</div></div>
      <div><label>Avg result per trade</label><div class="${avgPL>=0?'pnl-pos':'pnl-neg'}" style="padding:4px 0;">
        ${avgPL>=0?'+':''}$${fmt(Math.abs(avgPL))} (${avgPct>=0?'+':''}${fmt(avgPct,1)}%)</div></div>
    </div>
    <div class="row3">
      <div><label>Your pace (trades/month)</label><div style="padding:4px 0;color:var(--muted);">${fmt(tradesPerMonth,1)}</div></div>
      <div><label>Suggested monthly goal</label><div class="${goalClass}" style="font-size:18px;font-weight:600;padding:4px 0;">
        ${monthlyDollarGoal>=0?'+':''}$${fmt(Math.abs(monthlyDollarGoal))}</div></div>
      <div><label>As % of account</label><div style="padding:4px 0;color:var(--muted);">
        ${monthlyPctGoal!=null ? (monthlyPctGoal>=0?'+':'')+fmt(monthlyPctGoal,1)+'%' : 'log an account value to see this'}</div></div>
    </div>
    <div class="adj-text" style="margin-top:6px;">
      This is your own historical average result per trade, times your own historical trading pace — not a forecast,
      and not a target to force. With ${trades.length} trades logged it can still swing a lot from one closed trade
      to the next; it should get steadier the more you log, and it'll shift automatically as your results do.
    </div>
  </div>`;
}

function renderTradeHistoryCard(){
  const trades = (state.tradeHistory||[]).slice().sort((a,b)=> a.exitDate < b.exitDate ? -1 : 1);
  let body = '';
  if(!trades.length){
    body = `<div class="empty">No closed trades yet.</div>`;
  } else {
    body = `<div class="tbl-wrap"><table><thead><tr>
      <th>Ticker</th><th>Entry</th><th>Exit</th><th>Entry $</th><th>Exit $</th><th>Contracts</th><th>P&L</th>
    </tr></thead><tbody>`;
    for(let i=trades.length-1;i>=0;i--){
      const t = trades[i];
      const plClass = t.realizedPL>=0 ? 'pnl-pos' : 'pnl-neg';
      body += `<tr>
        <td>${t.ticker} ${t.side} $${t.strike}</td>
        <td>${t.entryDate}</td>
        <td>${t.exitDate}</td>

}

function renderAccountView(){
  const log = sortAccountLog();
  const latest = log[log.length-1];
  const first = log[0];

  let summary = '';
  if(latest){
    const changeVal = first ? latest.value - first.value : null;
    const changePct = first && first.value ? (changeVal/first.value)*100 : null;
    const changeClass = changeVal==null ? '' : (changeVal>=0 ? 'pnl-pos':'pnl-neg');
    const breakdown = (latest.components && latest.components.length) ? `
      <div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);">
        ${latest.components.map(c => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted);">
          <span>${c.label}</span><span>$${fmt(c.value)} (${latest.value ? fmt((c.value/latest.value)*100,1) : '0.0'}%)</span>
        </div>`).join('')}
      </div>` : '';
    summary = `<div class="card">
      <h2>Overview</h2>
      <div class="row3">
        <div><label>Current account size</label><div style="font-size:20px;font-weight:600;padding:4px 0;">$${fmt(latest.value)}</div></div>
        <div><label>Change since first logged</label><div class="${changeClass}" style="font-size:18px;font-weight:600;padding:4px 0;">

        </div></div>
        <div><label>1% of current value</label><div style="font-size:18px;font-weight:600;padding:4px 0;">$${fmt(latest.value*0.01)}</div></div>
      </div>
      <div class="adj-text" style="margin-top:4px;">
        That last figure is a quick reference for your year-end contribution-increase rule — next year's weekly VOO
        contribution is meant to go up by 1% of whatever the account is worth at that year's close, not today's value.
      </div>
      ${breakdown}
    </div>`;
  }

  const calcCard = renderPositionSizeCalc(latest);
  const goalsCard = renderGoalsCard(latest);

  // Seed today's form with yesterday's component labels (blank values) for convenience,
  // or two blank rows if nothing's been logged with a breakdown yet.
  const seedComponents = (latest && latest.components && latest.components.length)
    ? latest.components.map(c => ({label:c.label, value:''}))
    : [{label:'',value:''},{label:'',value:''}];
  acctRowCount = seedComponents.length - 1;

  const form = `<div class="card">
    <h2>Log account size</h2>
    <div class="row2" style="margin-bottom:10px;">
      <div class="field"><label>Date</label><input type="date" id="acct-date" value="${todayStr()}"></div>
      <div class="field"><label>Notes (optional)</label><input type="text" id="acct-notes" placeholder="e.g. after this week's VOO buy"></div>
    </div>
    <label>Breakdown — what's contributing to the total</label>
    <div id="acct-components-container">
      ${seedComponents.map((c,i)=>acctComponentRowHTML(i, c.label, c.value)).join('')}
    </div>
    <div class="foot-actions" style="margin-bottom:8px;">
      <button class="ghost" onclick="addAcctComponentRow()">+ Add component</button>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Total: $<span id="acct-total-preview">0.00</span></div>
    <button class="primary" onclick="addAccountEntry()">Add entry</button>
  </div>`;

  let chartCard = `<div class="card"><h2>Account size over time</h2>
    ${log.length ? '<div class="chart-wrap"><canvas id="acct-chart"></canvas><div class="chart-tooltip" id="acct-chart-tooltip"></div></div>' : '<div class="empty">No entries logged yet.</div>'}
  </div>`;

  let historyCard = `<div class="card"><h2>History</h2>`;
  if(!log.length){
    historyCard += `<div class="empty">Nothing logged yet — add your first entry above.</div>`;
  } else {
    historyCard += `<div class="tbl-wrap"><table><thead><tr>
      <th>Date</th><th>Value</th><th>Change</th><th>Breakdown</th><th>Notes</th><th></th>
    </tr></thead><tbody>`;
    for(let i=log.length-1;i>=0;i--){
      const e = log[i];
      const prev = log[i-1];
      const change = prev ? e.value - prev.value : null;
      const changePct = prev && prev.value ? (change/prev.value)*100 : null;
      const changeClass = change==null ? '' : (change>=0?'pnl-pos':'pnl-neg');
      const breakdownText = (e.components && e.components.length)
        ? e.components.map(c=>`${c.label}: $${fmt(c.value)}`).join(', ')
        : '—';
      historyCard += `<tr>

      </tr>`;
    }
    historyCard += `</tbody></table></div>`;
  }
  historyCard += `</div>`;

  return summary + goalsCard + renderMonthlyGoalCard() + calcCard + form + chartCard + historyCard + renderTradeHistoryCard();
}

function addAcctComponentRow(){
  acctRowCount++;
  document.getElementById('acct-components-container').insertAdjacentHTML('beforeend', acctComponentRowHTML(acctRowCount));
  updateAcctTotalPreview();
}

function removeAcctComponentRow(idx){
  const el = document.getElementById('acct-comp-row-'+idx);
  if(el) el.remove();

function updateAcctTotalPreview(){
  const values = document.querySelectorAll('#acct-components-container .acct-comp-value');
  let total = 0;
  values.forEach(v => { const n = parseFloat(v.value); if(!isNaN(n)) total += n; });

  if(el) el.textContent = fmt(total);

function collectAcctComponents(){
  const labels = document.querySelectorAll('#acct-components-container .acct-comp-label');
  const values = document.querySelectorAll('#acct-components-container .acct-comp-value');
  const components = [];
  for(let i=0;i<labels.length;i++){
    const label = labels[i].value.trim();
    const val = parseFloat(values[i].value);
    if(label && !isNaN(val)) components.push({label, value: val});
  }
  return components;
}

const DEFAULT_ACCOUNT_GOALS = [500, 1000, 2500, 5000, 10000, 25000, 50000];

function findGoalAchievedDate(goal, log){
  const hit = log.find(e => e.value >= goal);
  return hit ? hit.date : null;
}

function renderGoalsCard(latest){
  const log = sortAccountLog();
  const currentValue = latest ? latest.value : 0;
  const goals = (state.goalsCustomized ? state.accountGoals : DEFAULT_ACCOUNT_GOALS).slice().sort((a,b)=>a-b);

  let rows = '';
  if(!log.length){
    rows = `<div class="empty">Log at least one account value to track progress toward these.</div>`;
  } else {
    goals.forEach(g=>{
      const achievedDate = findGoalAchievedDate(g, log);
      const pct = Math.min(100, Math.max(0,(currentValue/g)*100));
      rows += `<div style="margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
          <span>$${fmt(g,0)}</span>
          <span style="color:${achievedDate?'var(--green)':'var(--muted)'};">
            ${achievedDate ? 'Reached ' + achievedDate : '$' + fmt(Math.max(g-currentValue,0),0) + ' to go'}
          </span>
          <span class="del-x" onclick="removeAcctGoal(${g})" title="Remove milestone">✕</span>
        </div>
        <div style="background:var(--card-2);border-radius:6px;height:8px;overflow:hidden;">
          <div style="width:${pct}%;height:100%;background:${achievedDate?'var(--green)':'var(--accent)'};"></div>
        </div>
      </div>`;
    });
  }

  return `<div class="card">
    <h2>Milestones</h2>

    <div class="row2" style="margin-top:6px;">
      <div class="field"><input type="number" step="1" id="new-goal-amount" placeholder="e.g. 750"></div>
      <div class="field"><button class="ghost" style="width:100%;" onclick="addAcctGoal()">Add milestone</button></div>
    </div>
  </div>`;
}

async function ensureGoalsCustomized(){
  if(!state.goalsCustomized){
    state.accountGoals = [...DEFAULT_ACCOUNT_GOALS];
    state.goalsCustomized = true;
  }
}

async function addAcctGoal(){
  const val = parseFloat(document.getElementById('new-goal-amount').value);
  if(isNaN(val) || val <= 0){ alert('Enter a valid milestone amount.'); return; }
  await ensureGoalsCustomized();
  if(!state.accountGoals.includes(val)) state.accountGoals.push(val);
  await saveAccountGoals();
  render();
}

async function removeAcctGoal(val){
  await ensureGoalsCustomized();
  state.accountGoals = state.accountGoals.filter(g => g !== val);
  await saveAccountGoals();
  render();
}

async function addAccountEntry(){
  const date = document.getElementById('acct-date').value || todayStr();
  const notes = document.getElementById('acct-notes').value.trim();
  const components = collectAcctComponents();
  if(!components.length){ alert('Enter at least one component with a label and a value.'); return; }
  const value = components.reduce((a,c)=>a+c.value,0);

  const existingIdx = state.accountLog.findIndex(e => e.date === date);
  const entry = {date, value, components, notes: notes || null};
  if(existingIdx >= 0) state.accountLog[existingIdx] = entry;
  else state.accountLog.push(entry);

  await saveAccountLog();
  render();
}

async function deleteAccountEntry(date){
  state.accountLog = state.accountLog.filter(e => e.date !== date);
  await saveAccountLog();
  render();
}

function drawAccountChart(){
  const canvas = document.getElementById('acct-chart');
  if(!canvas) return;
  const log = sortAccountLog();
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 160;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const values = log.map(e=>e.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const pad = 16, plotW = w-pad*2, plotH = h-pad*2;

  function xAt(i){ return pad + (log.length<=1 ? 0 : (i/(log.length-1))*plotW); }
  function yAt(v){ return pad + plotH - ((v-min)/range)*plotH; }

  ctx.strokeStyle = '#3ddc97';
  ctx.lineWidth = 2;
  ctx.beginPath();
  log.forEach((e,i)=>{
    const x = xAt(i), y = yAt(e.value);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  log.forEach((e,i)=>{
    ctx.fillStyle = '#3ddc97';
    ctx.beginPath();
    ctx.arc(xAt(i), yAt(e.value), 3, 0, Math.PI*2);
    ctx.fill();
  });

  const points = log.map((e,i)=>{
    const prev = log[i-1];
    const change = prev ? e.value - prev.value : null;
    const changePct = prev && prev.value ? (change/prev.value)*100 : null;
    const changeHtml = change!=null
      ? `<div class="${change>=0?'':''}" style="color:${change>=0?'#3ddc97':'#ff6b6b'};">${change>=0?'+':''}$${fmt(Math.abs(change))} (${changePct>=0?'+':''}${fmt(changePct,1)}%)</div>`
      : '';
    return {
      x: xAt(i), y: yAt(e.value),
      html: `<div class="tt-title">${e.date}</div><div>$${fmt(e.value)}</div>${changeHtml}${e.notes?`<div class="tt-muted">${e.notes}</div>`:''}`
    };
  });
  attachPointTooltip(canvas, document.getElementById('acct-chart-tooltip'), points);
}

function drawChart(pos, entries, peakSeries){
  const canvas = document.getElementById('chart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = 140;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);

  const marks = entries.map(e => computeMark(e.bid, e.ask)).filter(v => v!=null);
  if(marks.length < 1) return;
  const allVals = marks.concat([pos.entryPremium]);
  const min = Math.min(...allVals), max = Math.max(...allVals);
  const pad = 16, plotW = w - pad*2, plotH = h - pad*2;
  const range = (max - min) || 1;

  function xAt(i){ return pad + (entries.length<=1 ? 0 : (i/(entries.length-1))*plotW); }
  function yAt(v){ return pad + plotH - ((v-min)/range)*plotH; }

  // entry premium reference line
  ctx.strokeStyle = '#3a4050';
  ctx.setLineDash([4,4]);
  ctx.beginPath();
  ctx.moveTo(pad, yAt(pos.entryPremium));
  ctx.lineTo(w-pad, yAt(pos.entryPremium));
  ctx.stroke();
  ctx.setLineDash([]);

  // TP / SL lines
  const tpVal = pos.entryPremium * (1 + pos.tpPct/100);
  const slVal = pos.entryPremium * (1 + pos.slPct/100);
  ctx.strokeStyle = 'rgba(61,220,151,0.4)';
  ctx.beginPath(); ctx.moveTo(pad, yAt(tpVal)); ctx.lineTo(w-pad, yAt(tpVal)); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,107,107,0.4)';
  ctx.beginPath(); ctx.moveTo(pad, yAt(slVal)); ctx.lineTo(w-pad, yAt(slVal)); ctx.stroke();

  // premium line
  ctx.strokeStyle = '#5b8def';
  ctx.lineWidth = 2;
  ctx.beginPath();
  entries.forEach((e,i)=>{
    const m = computeMark(e.bid, e.ask);
    if(m==null) return;
    const x = xAt(i), y = yAt(m);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  entries.forEach((e,i)=>{
    const m = computeMark(e.bid, e.ask);
    if(m==null) return;
    ctx.fillStyle = '#5b8def';
    ctx.beginPath();
    ctx.arc(xAt(i), yAt(m), 3, 0, Math.PI*2);
    ctx.fill();
  });

  const points = [];
  entries.forEach((e,i)=>{
    const m = computeMark(e.bid, e.ask);
    if(m==null) return;
    const ev = evaluate(pos, e, peakSeries ? peakSeries[i] : null);
    points.push({
      x: xAt(i), y: yAt(m),
      html: `<div class="tt-title">${e.date} ${e.time||''}</div>
        <div>Stock: ${e.stockPrice!=null?'$'+fmt(e.stockPrice):'—'}</div>
        <div>Mark: $${fmt(m)}</div>
        <div style="color:${ev.pnlPct!=null && ev.pnlPct>=0?'#3ddc97':'#ff6b6b'};">P&L: ${ev.pnlPct!=null?(ev.pnlPct>=0?'+':'')+fmt(ev.pnlPct,1)+'%':'—'}</div>
        <div class="tt-muted">DTE: ${ev.dte}${e.iv!=null?' · IV '+fmt(e.iv,1)+'%':''}</div>`
    });
  });
  attachPointTooltip(canvas, document.getElementById('chart-tooltip'), points);
}

loadState();
</script>
